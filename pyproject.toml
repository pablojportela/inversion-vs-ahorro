[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inversion-vs-ahorro"
version = "0.1.0"
description = "Pipeline para generar Shorts comparando crecimiento de inversión vs ahorro con datos reales."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
